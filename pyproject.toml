[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boldt-posttrain-autoresearch"
version = "0.1.0"
description = "German-first post-training AutoResearch loop for mayflowergmbh/boldt-dc-1b-german-it-16k-dpo (branch -> specialist -> merge -> eval -> promote)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Boldt post-training maintainers" }]
keywords = ["post-training", "german", "lora", "qlora", "dpo", "mergekit", "instruction-tuning"]

# The loop's CORE and ALL dry-run / validation / scoring / integrity gates run on the
# Python standard library only. Heavy ML dependencies are optional and used solely by the
# `--real` training / merge / eval code paths (which are dry-runnable without weights here).
dependencies = []

[project.optional-dependencies]
train = [
  "torch==2.13.0",
  "transformers==5.17.0",
  "trl==1.14.1",
  "peft==0.21.2",
  "accelerate==1.15.0",
  "datasets==4.8.5",
  "bitsandbytes==0.49.2",
  "jsonschema==4.26.0",
]
perf = [
  "liger-kernel==0.8.4",
]
rl = [
  "math-verify==0.9.0",
]
# Mergekit for the merge-search lever (linear/slerp/ties/dare-ties over compatible checkpoints).
# Pinned to an exact upstream commit (0.1.5 dev): the last release, 0.1.4, caps
# pydantic <2.11, transformers 4.x and safetensors <0.6, which the transformers 5 /
# vLLM stack cannot satisfy. Move to a PyPI release once 0.1.5 is published.
merge = [
  "mergekit @ git+https://github.com/arcee-ai/mergekit@9eeb539892c6753b032ea164e818b44a8c7a401b",
]
# German-core benchmark suite (lm-eval German tasks) + dataset access for instruction evals.
eval = [
  "lm-eval==0.4.13",
  "datasets==4.8.5",
]
# Language-id for the German-candidate data filter (deterministic fastText/langid check).
# Hub 1.x downloads through hf-xet; hf-transfer is no longer used.
data = [
  "fasttext-langdetect==1.1.1",
  "huggingface-hub==1.16.1",
  "datasets==4.8.5",
  # MinHash near-dedup and leakage LSH in secure_compat.data_pipeline. It was
  # imported but never declared, so `data prepare` failed closed with
  # ModuleNotFoundError -- the secure data path had never actually run.
  "datasketch==1.6.5",
]
# Offline teacher generation for sequence-level distillation (seqkd lever).
# Qwen3.8 needs transformers >= 5.8 and a vLLM build with its hybrid attention.
teacher = [
  "vllm==0.27.1",
]
dev = [
  "pytest==7.4.4",
  "ruff==0.15.22",
]

[project.scripts]
pt = "boldt_posttrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

